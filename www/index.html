<!DOCTYPE html>
<html lang="id">
<head>

<title>Jadwal Guru — SMP ABBS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  background: #1a1511; color: #ece3d9;
  height: 100vh; height: 100dvh; overflow: hidden;
}
.page-wrap { max-width: 100%; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

/* ===== LANDING ===== */
.landing {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 24px; padding: 40px 24px;
}
.landing h1 { font-family: 'Georgia', serif; font-weight: 600; font-size: 26px; color: #c9a96e; text-align: center; }
.landing .sub { font-size: 12px; color: #8a7a6a; text-align: center; margin-top: -16px; }
.landing .menu-card {
  width: 100%; max-width: 320px; padding: 20px; border-radius: 16px;
  background: #26211c; border: 1px solid #3d352e; cursor: pointer;
  display: flex; align-items: center; gap: 16px; transition: all .12s ease;
}
.landing .menu-card:hover { background: #2d2823; border-color: #d4a857; }
.landing .menu-card .icon {
  width: 48px; height: 48px; border-radius: 12px; display: flex;
  align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
}
.landing .menu-card .icon.green { background: #17332a; }
.landing .menu-card .icon.gold { background: #33281a; }
.landing .menu-card .info h3 { font-size: 16px; font-weight: 600; }
.landing .menu-card .info p { font-size: 12px; color: #8a7a6a; margin-top: 2px; }

/* ===== TAB BAR ===== */
.tab-bar {
  display: flex; background: #26211c; border-bottom: 1px solid #3d352e; flex: 0 0 auto;
}
.tab-btn {
  flex: 1; padding: 12px 8px; text-align: center; font-size: 11px; font-weight: 600;
  color: #8a7a6a; border: none; background: transparent; cursor: pointer;
  border-bottom: 2px solid transparent; transition: all .12s ease; white-space: nowrap;
}
.tab-btn.active { color: #d4a857; border-bottom-color: #d4a857; }
.tab-panel { display: none; flex: 1; flex-direction: column; }
.tab-panel.active { display: flex; }

/* ===== JADWAL GURU (existing) ===== */
header {
  flex: 0 0 auto; padding: 8px 18px 6px; display: flex;
  align-items: center; justify-content: space-between;
  border-bottom: 1px solid #3d352e;
}
header h1 { font-family: 'Georgia', serif; font-weight: 600; font-size: 18px; }
header .sub { font-size: 9px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #d4a857; }
header .back-btn { background: none; border: none; color: #d4a857; font-size: 20px; cursor: pointer; padding: 4px; }

.teacher-bar {
  flex: 0 0 auto; padding: 10px 18px 6px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 60px;
}
.teacher-bar .name-section { display: flex; align-items: baseline; gap: 4px; flex: 1; min-width: 0; }
.teacher-bar .teacher-name { font-family: 'Georgia', serif; font-style: italic; font-size: 20px; color: #c9a96e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.teacher-bar .chips { display: flex; gap: 6px; }
.teacher-bar .chip { display: flex; align-items: center; gap: 3px; background: #26211c; border: 1px solid #3d352e; border-radius: 100px; padding: 3px 10px; font-size: 11px; color: #b8aa9a; }
.teacher-bar .chip .num { font-family: monospace; font-weight: 600; font-size: 13px; color: #d4a857; }
.teacher-bar .meta-line { width: 100%; font-size: 11px; color: #8a7a6a; }
.teacher-bar .meta-line b { color: #b8aa9a; }

.table-area { flex: 1; min-height: 0; margin: 0 14px; overflow: hidden; }
.tablewrap { height: 100%; overflow-x: auto; overflow-y: hidden; border-radius: 14px; border: 1px solid #3d352e; background: #26211c; -webkit-overflow-scrolling: touch; }
.t-flex { display: flex; flex-direction: column; height: 100%; min-width: 576px; }
.t-head { display: flex; flex: 0 0 auto; border-bottom: 1.5px solid #5a4f42; }
.t-head > div { flex: 0 0 90px; padding: 8px 6px; text-align: center; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #d4a857; border-right: 1px solid #5a4f42; display: flex; align-items: center; justify-content: center; }
.t-head > div:first-child { flex: 0 0 36px; color: #8a7a6a; }
.t-head > div:last-child { border-right: none; }
.t-head > div:nth-child(6) { color: #e096ab; }
.t-head > div:nth-child(7) { color: #7ab0d4; }
.t-body { flex: 1; display: flex; flex-direction: column; }
.t-row { flex: 1; display: flex; border-bottom: 1.5px solid #5a4f42; min-height: 0; }
.t-row:last-child { border-bottom: none; }
.t-row > div { flex: 0 0 90px; border-right: 1px solid #5a4f42; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.t-row > div:last-child { border-right: none; }
.t-row > div:first-child { flex: 0 0 36px; align-items: center; background: #1a1511; position: sticky; left: 0; z-index: 1; }
.jam-num { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: #33281a; color: #d4a857; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; }
.cell-time { font-family: monospace; font-size: 9px; font-weight: 600; color: #b8aa9a; margin-bottom: 1px; }
.cell-cls { font-weight: 600; font-size: 13px; line-height: 1.15; }
.cell-subj { font-size: 10px; color: #8a7a6a; }
.slot { padding: 0 6px; }
.slot.boys { border-left: 3px solid #7ab0d4; background: #1a1f28; }
.slot.girls { border-left: 3px solid #d49db0; background: #281a20; }
.slot.mixed { border-left: 3px solid #d4a857; background: #282018; }
.slot-empty { align-items: center; text-align: center; color: #3d352e; font-size: 14px; }
.slot-off { background: repeating-linear-gradient(135deg, #1a1511 0, #1a1511 1px, transparent 1px, transparent 5px); opacity: .4; }

.bottom-bar {
  flex: 0 0 auto; padding: 6px 18px 10px; display: flex; flex-direction: column; gap: 6px;
  border-top: 1px solid #2d2823; background: #1a1511; min-height: 88px;
}
.bot-row1 { display: flex; align-items: center; gap: 10px; }
.bot-row1 .search-wrap { flex: 1; position: relative; }
.bot-row1 input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 10px; border: 1px solid #3d352e; background: #26211c; color: #ece3d9; font-size: 14px; }
.bot-row1 input::placeholder { color: #8a7a6a; }
.bot-row1 .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #8a7a6a; font-size: 14px; }
.bot-row1 .guru-pos { font-size: 11px; color: #8a7a6a; white-space: nowrap; }
.bot-row1 .nav-btns { display: flex; gap: 6px; }
.bot-row1 .nav-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #3d352e; background: #26211c; color: #b8aa9a; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }
.bot-row1 .nav-btn:active { background: #d4a857; color: #1a1511; border-color: #d4a857; }
.bot-row2 { display: flex; align-items: center; gap: 6px; }
.bot-row2 .teacher-strip { flex: 1; display: flex; overflow-x: auto; gap: 5px; padding: 2px 0; -webkit-overflow-scrolling: touch; }
.bot-row2 .teacher-strip button { flex: 0 0 auto; padding: 6px 14px; font-size: 12px; font-weight: 500; border-radius: 8px; border: 1px solid #3d352e; background: #1a1511; color: #b8aa9a; cursor: pointer; white-space: nowrap; }
.bot-row2 .teacher-strip button:active { background: #d4a857; color: #1a1511; border-color: #d4a857; }
.bot-row2 .teacher-strip button.active { background: #d4a857; color: #1a1511; border-color: #d4a857; }
.bot-row2 .teacher-strip button .gt { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; }

.piket-bar { flex: 0 0 auto; margin: 0 14px 4px; padding: 8px 12px; background: #26211c; border: 1px solid #3d352e; border-radius: 10px; display: flex; align-items: center; gap: 8px; min-height: 40px; transition: opacity .15s ease; }
.piket-bar.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
.piket-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #d4a857; flex-shrink: 0; }
.piket-list { flex: 1; display: flex; overflow-x: auto; gap: 6px; -webkit-overflow-scrolling: touch; }
.piket-list .p-item { flex: 0 0 auto; font-size: 12px; color: #ece3d9; white-space: nowrap; padding: 4px 10px; border-radius: 6px; background: #1a1511; border: 1px solid #3d352e; }
.piket-list .p-item .day-badge { font-weight: 600; color: #d4a857; margin-right: 5px; }

.legend { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 6px 18px; font-size: 9px; color: #8a7a6a; background: #1a1511; border-top: 1px solid #2d2823; }
.legend .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 3px; }
.legend .dot.boys { background: #7ab0d4; }
.legend .dot.girls { background: #d49db0; }

/* ===== FITUR CARI GURU LONGGAR ===== */
.longgar-panel { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }
.longgar-panel h2 { font-family: 'Georgia', serif; font-weight: 600; font-size: 18px; color: #c9a96e; }

.filter-section { display: flex; flex-direction: column; gap: 10px; }
.filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-row label { font-size: 11px; font-weight: 600; color: #8a7a6a; min-width: 50px; }
.filter-row .chip-group { display: flex; gap: 4px; flex-wrap: wrap; }
.filter-row .chip-group button {
  flex: 0 0 auto; padding: 6px 14px; font-size: 12px; font-weight: 500; border-radius: 8px;
  border: 1px solid #3d352e; background: #1a1511; color: #8a7a6a; cursor: pointer; white-space: nowrap; transition: all .1s ease;
}
.filter-row .chip-group button.selected { background: #d4a857; color: #1a1511; border-color: #d4a857; }
.filter-row .chip-group button.disabled { opacity: .35; cursor: default; }
.filter-row select {
  padding: 6px 12px; border-radius: 8px; border: 1px solid #3d352e; background: #26211c;
  color: #ece3d9; font-size: 12px; cursor: pointer;
}

.btn-cari {
  padding: 12px; border-radius: 12px; border: none; background: #d4a857; color: #1a1511;
  font-size: 14px; font-weight: 600; cursor: pointer; text-align: center;
}
.btn-cari:active { background: #c49a40; }
.btn-cari:disabled { opacity: .4; cursor: default; }
.btn-cari .count { font-weight: 400; opacity: .7; }

.result-section { display: flex; flex-direction: column; gap: 6px; }
.result-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
.result-header h3 { font-size: 13px; font-weight: 600; color: #b8aa9a; }
.result-header span { font-size: 11px; color: #8a7a6a; }
.result-item {
  padding: 10px 14px; border-radius: 10px; background: #26211c; border: 1px solid #3d352e;
  display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all .1s ease;
}
.result-item:active { border-color: #d4a857; }
.result-item .rank { font-size: 16px; font-weight: 600; color: #d4a857; min-width: 24px; }
.result-item .info { flex: 1; min-width: 0; }
.result-item .info .name { font-weight: 600; font-size: 14px; }
.result-item .info .detail { font-size: 11px; color: #8a7a6a; margin-top: 1px; }
.result-item .info .detail .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; margin-right: 4px; background: #1a1511; color: #7ab0d4; border: 1px solid #332a22; }
.result-item .info .detail .tag.girls { color: #d49db0; }
.result-item .badge { font-size: 20px; font-weight: 700; color: #d4a857; text-align: center; min-width: 40px; }
.result-item .badge small { display: block; font-size: 9px; font-weight: 400; color: #8a7a6a; }

.empty-state { text-align: center; padding: 40px 20px; color: #8a7a6a; }
.empty-state .big { font-size: 36px; margin-bottom: 12px; }
.empty-state p { font-size: 13px; }

@media (min-width: 768px) {
  .page-wrap { padding: 0 24px; }
  .t-flex { min-width: auto; }
  .t-head > div, .t-row > div { flex: 1 1 0; }
  .t-head > div:first-child, .t-row > div:first-child { flex: 0 0 42px; }
  .filter-row .chip-group button { font-size: 13px; padding: 8px 18px; }
  .longgar-panel { padding: 24px 0; }
}
</style>
</head>

var order = DATA.order;
var teachers = DATA.teachers;
var days = DATA.days;
var dayId = DATA.day_id;
var validByDay = DATA.valid_lessons_by_day;
var currentJadwal = 0;

function dedupe(arr) { var s={},r=[]; arr.forEach(function(e){var k=e['class']+'|'+e.subject;if(!s[k]){s[k]=true;r.push(e)}}); return r; }

function buildTable(t) {
  var h='<div class="t-head"><div>#</div>';
  days.forEach(function(d){
    var ex=d==='Friday'?' style="color:#e096ab;"':d==='Saturday'?' style="color:#7ab0d4;"':'';
    h+='<div'+ex+'>'+dayId[d]+'</div>';
  }); h+='</div>';
  var rows='<div class="t-body">';
  DATA.lessons.forEach(function(lesson){
    var row='<div class="t-row"><div><span class="jam-num">'+lesson+'</span></div>';
    days.forEach(function(day){
      if(validByDay[day].indexOf(lesson)===-1){row+='<div class="slot-off"></div>';return;}
      var key=day+'|'+lesson,entries=t.cells[key];
      if(entries&&entries.length){
        var uniq=dedupe(entries),genders={};
        uniq.forEach(function(e){genders[e.gender]=true;});
        var cellGender=Object.keys(genders).length===1?uniq[0].gender:'mixed';
        var first=uniq[0],clsText=uniq.length===1?first['class']:uniq.map(function(e){return e['class'];}).join(', ');
        var subjSet={};uniq.forEach(function(e){subjSet[e.subject]=true;});
        row+='<div class="slot '+cellGender+'"><span class="cell-time">'+first.start+'\u2013'+first.end+'</span><span class="cell-cls">'+clsText+'</span><span class="cell-subj">'+Object.keys(subjSet).join(', ')+'</span></div>';
      }else{row+='<div class="slot-empty">\u2013</div>';}
    }); row+='</div>'; rows+=row;
  }); rows+='</div>'; return h+rows;
}

function renderJadwal() {
  var t=teachers[order[currentJadwal]];
  document.getElementById('tName').textContent=t.fullname;
  document.getElementById('tJam').textContent=t.stats.total_lessons;
  document.getElementById('tHari').textContent=t.stats.active_days;
  document.getElementById('tKelas').textContent=t.stats.classes.join(', ');
  document.getElementById('tMapel').textContent=t.stats.subjects.join(', ');
  document.getElementById('guruPos').textContent=(currentJadwal+1)+'/'+order.length;
  document.getElementById('gridTable').innerHTML=buildTable(t);
  buildPiket(t); buildStrip();
}

function buildPiket(t) {
  var nick=order[currentJadwal],duties=PIKET[nick];
  var barEl=document.getElementById('piketBar'),listEl=document.getElementById('piketList');
  if(!duties||!duties.length){barEl.classList.add('hidden');return;}
  barEl.classList.remove('hidden');listEl.innerHTML='';
  duties.forEach(function(d){var el=document.createElement('span');el.className='p-item';el.innerHTML='<span class="day-badge">'+d.hari+'</span>'+d.lokasi;listEl.appendChild(el);});
}

function buildStrip() {
  var strip=document.getElementById('teacherStrip'),filter=document.getElementById('searchInput').value.trim().toLowerCase();strip.innerHTML='';
  order.forEach(function(nick,idx){
    if(filter&&nick.toLowerCase().indexOf(filter)===-1)return;
    var t=teachers[nick],g=function(t){var gs={};Object.values(t.cells).forEach(function(a){a.forEach(function(e){gs[e.gender]=true;})});var k=Object.keys(gs);return k.length===1?k[0]:'mixed';}(t);
    var c=g==='boys'?'#7ab0d4':g==='girls'?'#d49db0':'#d4a857';
    var btn=document.createElement('button');btn.className=idx===currentJadwal?'active':'';btn.innerHTML='<span class="gt" style="background:'+c+'"></span>'+nick;
    btn.addEventListener('click',function(){currentJadwal=idx;renderJadwal();});strip.appendChild(btn);
  });
}

document.getElementById('searchInput').addEventListener('input',buildStrip);
document.getElementById('prevBtn').addEventListener('click',function(){currentJadwal=(currentJadwal-1+order.length)%order.length;renderJadwal();});
document.getElementById('nextBtn').addEventListener('click',function(){currentJadwal=(currentJadwal+1)%order.length;renderJadwal();});

// ===== CARI GURU LONGGAR =====
var selectedHari = [];
var selectedJam = [];
var MAX_JAM = 3;

function initLonggar() {
  // Day chips
  var daysIndo = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  var hariEl = document.getElementById('filterHari'); hariEl.innerHTML = '';
  daysIndo.forEach(function(d,i){
    var btn = document.createElement('button');
    btn.textContent = d;
    btn.dataset.idx = i;
    if(i===4) btn.classList.add('short');
    if(i===5) btn.classList.add('short');
    btn.addEventListener('click', function(){
      if(selectedHari.length===1 && this.classList.contains('selected')) {
        // deselect
        this.classList.remove('selected');
        selectedHari = [];
      } else {
        // select only this one
        hariEl.querySelectorAll('.selected').forEach(function(b){b.classList.remove('selected');});
        this.classList.add('selected');
        selectedHari = [parseInt(this.dataset.idx)];
      }
      updateBtnCari();
    });
    hariEl.appendChild(btn);
  });

  // Jam chips (1-9)
  var jamEl = document.getElementById('filterJam'); jamEl.innerHTML = '';
  for(var i=1;i<=9;i++){
    (function(lesson){
      var btn = document.createElement('button');
      btn.textContent = lesson;
      btn.dataset.lesson = lesson;
      btn.addEventListener('click', function(){
        if(this.classList.contains('selected')) {
          this.classList.remove('selected');
          selectedJam = selectedJam.filter(function(j){return j!==lesson;});
        } else {
          if(selectedJam.length < MAX_JAM) {
            this.classList.add('selected');
            selectedJam.push(lesson);
          }
        }
        updateBtnCari();
      });
      jamEl.appendChild(btn);
    })(i);
  }

  // Mapel options
  var mapelEl = document.getElementById('filterMapel'); 
  mapelEl.innerHTML = '<option value="">Semua Mapel</option>';
  var subjects = {};
  order.forEach(function(n){ teachers[n].stats.subjects.forEach(function(s){subjects[s]=true;}); });
  Object.keys(subjects).sort().forEach(function(s){
    var o = document.createElement('option'); o.value=s; o.textContent=s;
    mapelEl.appendChild(o);
  });

  document.getElementById('resultSection').style.display = 'none';
}

function updateBtnCari() {
  var btn = document.getElementById('btnCari');
  var txt = '🔍 Cari Guru Longgar';
  if(selectedHari.length>0) txt += ' — ' + ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][selectedHari[0]];
  if(selectedJam.length>0) txt += ' jam ' + selectedJam.join(',');
  btn.textContent = txt;
}

function cariLonggar() {
  if(selectedHari.length===0) return;
  var dayIdx = selectedHari[0];
  var dayKey = days[dayIdx];
  var jamTerpilih = selectedJam.length > 0 ? selectedJam : DATA.lessons.filter(function(l){return validByDay[dayKey].indexOf(l)!==-1;});
  var mapelFilter = document.getElementById('filterMapel').value;
  var genderFilter = document.getElementById('filterGender').value;

  var results = [];
  order.forEach(function(nick){
    var t = teachers[nick];
    if(mapelFilter && t.stats.subjects.indexOf(mapelFilter)===-1) return;
    if(genderFilter) {
      var genders={}; Object.values(t.cells).forEach(function(a){a.forEach(function(e){genders[e.gender]=true;})});
      var g=Object.keys(genders); if(g.length===1 && g[0]!==genderFilter) return;
    }

    var kosong = [];
    jamTerpilih.forEach(function(j){
      var key = dayKey + '|' + j;
      if(!t.cells[key] || t.cells[key].length===0) kosong.push(j);
    });

    if(kosong.length > 0) {
      results.push({nick:nick, name:t.fullname, subj:t.stats.subjects.join(','), kosong:kosong, count:kosong.length});
    }
  });

  // Sort: most free first
  results.sort(function(a,b){return b.count - a.count;});

  // Show results
  var section = document.getElementById('resultSection');
  section.style.display = 'block';
  var dayName = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][dayIdx];
  var html = '<div class="result-header"><h3>📊 Hasil Pencarian</h3><span>'+results.length+' guru tersedia</span></div>';
  
  if(results.length===0) {
    html += '<div class="empty-state"><div class="big">🔍</div><p>Tidak ada guru yang longgar di '+dayName+' jam '+jamTerpilih.join(',')+'</p></div>';
  } else {
    results.forEach(function(r,i){
      var g = function(t){var gs={};Object.values(t.cells).forEach(function(a){a.forEach(function(e){gs[e.gender]=true;})});var k=Object.keys(gs);return k.length===1?k[0]:'mixed';}(teachers[r.nick]);
      var genderTag = g==='boys'?'<span class="tag">Putra</span>':g==='girls'?'<span class="tag girls">Putri</span>':'<span class="tag" style="color:#d4a857;border-color:#3d352e;">Campur</span>';
      html += '<div class="result-item" onclick="lihatJadwal(\''+r.nick+'\')">';
      html += '<div class="rank">'+(i+1)+'</div>';
      html += '<div class="info"><div class="name">'+r.name+'</div><div class="detail">'+genderTag+' '+r.subj+' · Kosong jam '+r.kosong.join(', ')+'</div></div>';
      html += '<div class="badge">'+r.count+'<small>longgar</small></div>';
      html += '</div>';
    });
  }

  section.innerHTML = html;
}

function lihatJadwal(nick) {
  // Switch to jadwal view for this teacher
  var idx = order.indexOf(nick);
  if(idx>=0) currentJadwal = idx;
  goTo('jadwal');
  renderJadwal();
}

// ===== INIT =====
renderJadwal();
</script>
