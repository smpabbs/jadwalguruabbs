<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1511">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Mengajar Guru — SMP ABBS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  background: #1a1511; color: #ece3d9;
  height: 100vh; height: 100dvh; overflow: hidden;
}
.page-wrap {
  max-width: 1280px; margin: 0 auto;
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
}

/* HEADER */
header {
  flex: 0 0 auto; padding: 6px 22px 5px; margin: 0 22px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid #3d352e;
}
header h1 { font-family: 'Georgia', serif; font-weight: 600; font-size: 17px; white-space: nowrap; }
header .sub { font-size: 8px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #d4a857; }

/* TEACHER INFO */
.teacher-bar {
  flex: 0 0 auto; padding: 8px 22px 6px; margin: 0 22px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  flex-wrap: wrap;
}
.teacher-bar .name-section {
  display: flex; align-items: baseline; gap: 8px; min-width: 0;
}
.teacher-bar .teacher-name {
  font-family: 'Georgia', serif; font-style: italic; font-size: 16px; color: #c9a96e;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.teacher-bar .teacher-nick {
  font-family: monospace; font-size: 10px; color: #b8aa9a;
  background: #26211c; border: 1px solid #3d352e; border-radius: 6px; padding: 1px 6px; flex-shrink: 0;
}
.teacher-bar .chips { display: flex; gap: 6px; flex-shrink: 0; }
.teacher-bar .chip {
  display: flex; align-items: center; gap: 3px;
  background: #26211c; border: 1px solid #3d352e; border-radius: 100px; padding: 2px 8px;
  font-size: 9px; color: #b8aa9a;
}
.teacher-bar .chip .num { font-family: monospace; font-weight: 600; font-size: 11px; color: #d4a857; }
.teacher-bar .meta-line {
  width: 100%; font-size: 9px; color: #8a7a6a;
}
.teacher-bar .meta-line b { color: #b8aa9a; font-weight: 600; }

/* TABLE AREA */
.table-area {
  flex: 1; min-height: 0; margin: 0 22px 4px; overflow: hidden;
  display: flex; flex-direction: column;
}
.tablewrap {
  flex: 1; overflow: auto; border-radius: 12px;
  border: 1px solid #3d352e; background: #26211c;
}
table.grid {
  border-collapse: collapse; width: 100%; min-width: 640px;
  font-size: 11px; table-layout: fixed;
}
table.grid th {
  position: sticky; top: 0; background: #14100c; z-index: 1;
  padding: 6px 6px; text-align: center; font-size: 9px;
  font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  border-bottom: 2px solid #5a4f42; border-right: 1.5px solid #5a4f42; color: #d4a857;
}
table.grid th:last-child { border-right: none; }
table.grid th:first-child {
  position: sticky; left: 0; z-index: 2; background: #14100c;
  min-width: 32px; width: 32px; color: #8a7a6a;
}
table.grid th:nth-child(6) { color: #d49db0; }
table.grid th:nth-child(7) { color: #7ab0d4; }

table.grid td {
  padding: 6px 6px; text-align: center; vertical-align: middle;
  font-size: 10px; line-height: 1.3; height: 46px;
  border-right: 1.5px solid #5a4f42;
}
table.grid td:last-child { border-right: none; }
table.grid td:first-child {
  position: sticky; left: 0; z-index: 1; background: #1a1511;
}
table.grid tbody tr {
  border-bottom: 2px solid #5a4f42;
}
table.grid tbody tr:last-child {
  border-bottom: none;
}

.jam-num {
  display: inline-flex; width: 18px; height: 18px; border-radius: 50%;
  background: #33281a; color: #d4a857; align-items: center;
  justify-content: center; font-size: 8px; font-weight: 600;
}
td.slot { padding: 5px 6px !important; text-align: left !important; cursor: default; }
td.slot .cell-time { display: block; font-family: monospace; font-size: 8px; font-weight: 600; color: #b8aa9a; }
td.slot .cell-cls { font-weight: 600; font-size: 11px; display: block; }
td.slot .cell-subj { font-size: 9px; color: #8a7a6a; }
td.slot.boys { border-left: 3px solid #7ab0d4; background: #1a1f28; }
td.slot.girls { border-left: 3px solid #d49db0; background: #281a20; }
td.slot.mixed { border-left: 3px solid #d4a857; background: #282018; }
td.slot-empty { color: #3d352e; font-size: 12px; }
td.slot-off {
  background: repeating-linear-gradient(135deg, #2d2823 0, #2d2823 1px, transparent 1px, transparent 5px);
  opacity: .4;
}

/* time note */
.time-note {
  flex: 0 0 auto; text-align: center; padding: 4px; font-size: 8px; color: #8a7a6a;
  background: #26211c; border: 1px solid #3d352e; border-top: 0; border-radius: 0 0 12px 12px;
  line-height: 1.4;
}

/* BOTTOM BAR */
.bottom-bar {
  flex: 0 0 auto; padding: 6px 22px 10px; margin: 0 22px;
  display: flex; flex-direction: column; gap: 6px;
}
.bottom-bar .bot-row1 {
  display: flex; align-items: center; gap: 8px;
}
.bottom-bar .bot-row1 .search-wrap {
  flex: 1; position: relative;
}
.bottom-bar .bot-row1 input {
  width: 100%; padding: 7px 10px 7px 28px; border-radius: 8px; border: 1px solid #3d352e;
  background: #26211c; color: #ece3d9; font-size: 12px;
}
.bottom-bar .bot-row1 input::placeholder { color: #8a7a6a; }
.bottom-bar .bot-row1 .search-icon {
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  color: #8a7a6a; font-size: 12px;
}
.bottom-bar .bot-row1 .nav-btns { display: flex; gap: 5px; }
.bottom-bar .bot-row1 .nav-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid #3d352e; background: #26211c; color: #b8aa9a;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  font-size: 14px;
}
.bottom-bar .bot-row1 .nav-btn:hover { background: #d4a857; color: #1a1511; border-color: #d4a857; }
.bottom-bar .bot-row1 .guru-pos { font-size: 10px; color: #8a7a6a; white-space: nowrap; }

.bottom-bar .bot-row2 {
  display: flex; align-items: center; gap: 6px;
}
.bottom-bar .bot-row2 .teacher-strip {
  flex: 1; display: flex; overflow-x: auto; gap: 4px; padding: 2px 0;
}
.bottom-bar .bot-row2 .teacher-strip button {
  flex: 0 0 auto; padding: 4px 10px; font-size: 10px; font-weight: 500;
  border-radius: 6px; border: 1px solid #3d352e;
  background: #1a1511; color: #b8aa9a; cursor: pointer; white-space: nowrap;
}
.bottom-bar .bot-row2 .teacher-strip button:hover { background: #2d2518; color: #d4a857; }
.bottom-bar .bot-row2 .teacher-strip button.active { background: #d4a857; color: #1a1511; border-color: #d4a857; }
.bottom-bar .bot-row2 .teacher-strip button .gt {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-right: 4px;
}

.bottom-bar .bot-row3 {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
.bottom-bar .bot-row3 .legend {
  display: flex; align-items: center; gap: 10px; font-size: 9px; color: #8a7a6a;
}
.bottom-bar .bot-row3 .legend .dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; margin-right: 2px; }
.bottom-bar .bot-row3 .legend .dot.boys { background: #7ab0d4; }
.bottom-bar .bot-row3 .legend .dot.girls { background: #d49db0; }

/* RESPONSIVE */
@media (max-width: 860px) {
  header { margin: 0 10px; }
  .teacher-bar { margin: 0 10px; padding: 6px 10px 4px; }
  .table-area { margin: 0 10px 4px; }
  .bottom-bar { margin: 0 10px; padding: 4px 10px 10px; }
}
</style>
</head>

    document.getElementById('metaKelas').textContent = t.stats.classes.join(', ');
    document.getElementById('metaMapel').textContent = t.stats.subjects.join(', ');
    document.getElementById('guruPos').textContent = (current + 1) + '/' + order.length;
    document.getElementById('timeNote').textContent = timeRules;
    document.getElementById('tableContainer').innerHTML = buildTable(t);
    buildStrip();
    // Auto-scroll teacher strip to active teacher
    setTimeout(function(){
      var strip = document.getElementById('teacherStrip');
      var active = strip.querySelector('.active');
      if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }, 50);
  }

  function buildStrip() {
    var strip = document.getElementById('teacherStrip');
    var filter = document.getElementById('searchInput').value.trim().toLowerCase();
    strip.innerHTML = '';
    order.forEach(function(nick, idx){
      var matches = !filter || nick.toLowerCase().indexOf(filter) !== -1;
      if (!matches) return;
      var t = teachers[nick];
      var g = getGender(t);
      var color = g === 'boys' ? '#7ab0d4' : g === 'girls' ? '#d49db0' : '#d4a857';
      var btn = document.createElement('button');
      btn.className = 'teacher-item' + (idx === current ? ' active' : '');
      btn.innerHTML = '<span class="gt" style="background:' + color + '"></span>' + nick;
      btn.addEventListener('click', function(){ goTo(idx); });
      strip.appendChild(btn);
    });
  }

  function goTo(idx) {
    if (idx === current) return;
    current = (idx + order.length) % order.length;
    render();
  }

  document.getElementById('prevBtn').addEventListener('click', function(){ goTo(current - 1); });
  document.getElementById('nextBtn').addEventListener('click', function(){ goTo(current + 1); });
  document.getElementById('searchInput').addEventListener('input', function(){ buildStrip(); });
  document.addEventListener('keydown', function(e){
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft') goTo(current - 1);
  });
  render();
})();
</script>
</body>
</html>
