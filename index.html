:root {
  --ink: #1c2620; --ink-soft: #4b564c; --paper: #f2f4ee; --card: #ffffff; --line: #dbe0d4;
  --forest: #1f5c4c; --forest-soft: #e4efe9; --brass: #8f6318; --brass-soft: #f6ead1;
  --boys: #3f5c82; --boys-soft: #e7edf5; --girls: #a24b62; --girls-soft: #f6e6ea; --muted: #838d80;
  --shadow: 0 1px 2px rgba(28,38,32,.06), 0 10px 28px -14px rgba(28,38,32,.22);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #edf1e9; --ink-soft: #b7c2b6; --paper: #11150f; --card: #181f16; --line: #2a332a;
    --forest: #62c1a0; --forest-soft: #17332a; --brass: #dcae5c; --brass-soft: #33270f;
    --boys: #93b3da; --boys-soft: #1c2836; --girls: #e096ab; --girls-soft: #33202a; --muted: #74806f;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"] {
  --ink: #edf1e9; --ink-soft: #b7c2b6; --paper: #11150f; --card: #181f16; --line: #2a332a;
  --forest: #62c1a0; --forest-soft: #17332a; --brass: #dcae5c; --brass-soft: #33270f;
  --boys: #93b3da; --boys-soft: #1c2836; --girls: #e096ab; --girls-soft: #33202a; --muted: #74806f;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.65);
}
:root[data-theme="light"] {
  --ink: #1c2620; --ink-soft: #4b564c; --paper: #f2f4ee; --card: #ffffff; --line: #dbe0d4;
  --forest: #1f5c4c; --forest-soft: #e4efe9; --brass: #8f6318; --brass-soft: #f6ead1;
  --boys: #3f5c82; --boys-soft: #e7edf5; --girls: #a24b62; --girls-soft: #f6e6ea; --muted: #838d80;
  --shadow: 0 1px 2px rgba(28,38,32,.06), 0 10px 28px -14px rgba(28,38,32,.22);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; }

.page-wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; min-height: 0; }
@media (min-width: 861px) {
  html, body { overflow: hidden; }
  body { height: 100vh; height: 100dvh; }
  .page-wrap { height: 100vh; height: 100dvh; }
}

/* ---- page header (title band) ---- */
.page-header {
  flex: 0 0 auto; padding: 6px 22px 5px; margin: 0 22px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--line);
}
.ph-title-wrap { display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; }
.ph-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px; line-height: 1.15; margin: 0; letter-spacing: -.005em; white-space: nowrap; }
.ph-sub { font-size: 9.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--brass); white-space: nowrap; }
.page-header .nav-btns { justify-self: end; }

.shell {
  padding: 14px 22px; display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: 18px;
  align-items: stretch; flex: 1; min-height: 0;
}

/* ---- sidebar ---- */
.sidebar {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0;
}
.sidebar-title { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--brass); flex: 0 0 auto; }
.sidebar-sub { font-size: 10.5px; color: var(--muted); margin-top: -6px; flex: 0 0 auto; }
.search {
  width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--paper); color: var(--ink); font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; flex: 0 0 auto;
}
.search::placeholder { color: var(--muted); }
.teacher-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 3px; }
.teacher-item {
  display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; border: none;
  background: transparent; color: var(--ink-soft); font-size: 13px; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .12s ease, color .12s ease;
}
.teacher-item:hover { background: var(--forest-soft); color: var(--forest); }
.teacher-item.active { background: var(--forest); color: #fff; font-weight: 600; }
.teacher-item.hide { display: none; }
.no-match { font-size: 13px; color: var(--muted); padding: 8px; display: none; }

/* ---- cell layout switcher (preview only) ---- */
.variant-switch { flex: 0 0 auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
.variant-switch .vs-label { font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.vs-btns { display: flex; flex-direction: column; gap: 4px; }
.vs-btn {
  padding: 6px 8px; font-size: 11px; text-align: left; border-radius: 7px; border: 1px solid var(--line);
  background: var(--paper); color: var(--ink-soft); cursor: pointer; transition: background .12s ease, color .12s ease, border-color .12s ease;
}
.vs-btn:hover { border-color: var(--forest); color: var(--forest); }
.vs-btn.active { background: var(--forest); border-color: var(--forest); color: #fff; font-weight: 600; }

/* ---- main ---- */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.viewport { overflow: hidden; flex: 1; min-height: 0; }
.slide { height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 6px; }

.masthead { display: flex; flex-direction: column; gap: 3px; flex: 0 0 auto; }
.nav-btns { display: flex; gap: 6px; }
.nav-btn {
  width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  transition: background .12s ease, color .12s ease, border-color .12s ease;
}
.nav-btn:hover { background: var(--forest); color: #fff; border-color: var(--forest); }
.nav-btn svg { width: 12px; height: 12px; }

.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.title-cluster { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; min-width: 0; }
.teacher-name { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 18px; color: var(--forest); white-space: nowrap; }
.teacher-nick { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }

.chip-row { display: flex; gap: 7px; flex: 0 0 auto; }
.chip {
  display: flex; align-items: baseline; gap: 4px; background: var(--card); border: 1px solid var(--line);
  border-radius: 100px; padding: 3px 10px; box-shadow: var(--shadow); white-space: nowrap;
}
.chip .num { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: var(--forest); font-variant-numeric: tabular-nums; }
.chip .lbl { font-size: 10px; color: var(--muted); }

.meta-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; font-size: 10.5px; color: var(--ink-soft); }
.meta-line { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta-line b { color: var(--ink); font-weight: 600; }
.legend { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.legend .tag { display: inline-flex; align-items: center; gap: 4px; }
.legend .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.legend .dot.boys { background: var(--boys); }
.legend .dot.girls { background: var(--girls); }

.tablewrap { overflow: auto; border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--card); flex: 1; min-height: 0; }
table.grid { border-collapse: collapse; width: 100%; min-width: 760px; height: 100%; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); }
table.grid th:first-child, table.grid td:first-child { border-left: none; }
table.grid thead th {
  background: var(--forest-soft); color: var(--forest); font-weight: 600; font-size: 11px; letter-spacing: .05em;
  text-transform: uppercase; padding: 4px 6px; text-align: center; border-bottom: 1px solid var(--line);
}
table.grid thead th.corner { background: var(--card); }
table.grid .dayshort { display: none; }
th.jamcell { background: var(--card); padding: 0; width: 38px; text-align: center; vertical-align: middle; }
.jamnum {
  display: inline-flex; align-items: center; justify-content: center; width: 21px; height: 21px; border-radius: 50%;
  background: var(--forest-soft); color: var(--forest); font-family: 'IBM Plex Mono', monospace; font-weight: 600;
  font-size: 10.5px; font-variant-numeric: tabular-nums;
}
td.slot { padding: 5px 11px; vertical-align: middle; min-width: 108px; line-height: 1.2; }
td.slot.filled { border-left-width: 3px; }
td.slot.filled.boys { border-left: 3px solid var(--boys); background: var(--boys-soft); }
td.slot.filled.girls { border-left: 3px solid var(--girls); background: var(--girls-soft); }
td.slot.filled.mixed { border-left: 3px solid var(--brass); background: var(--brass-soft); }
/* multiple simultaneous classes (team-teaching) in one slot */
td.slot.filled .mcls { font-weight: 600; }
td.slot.filled .mcls.boys { color: var(--boys); }
td.slot.filled .mcls.girls { color: var(--girls); }
td.slot.filled .msep { color: var(--muted); font-weight: 400; }
/* .cellbox is a plain block wrapper inside <td> — variant layout (grid/flex) is applied
   here, never on the <td> itself, because display:grid/flex directly on a table cell
   breaks the browser's row-height equalization (each cell then sizes independently). */
td.slot.filled .cellbox { display: block; }
td.slot.filled .time { display: block; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--ink-soft); margin-bottom: 3px; }
td.slot.filled .combo { display: block; }
td.slot.filled .cls { font-weight: 600; font-size: 14px; color: var(--ink); }
td.slot.filled .subj { font-weight: 400; font-size: 11px; color: var(--muted); }
td.slot.filled .subj::before { content: " \00b7 "; color: var(--line); }
td.slot.empty { text-align: center; }
td.slot.empty .dash { color: var(--line); font-size: 13px; }
/* period doesn't exist that day at all (Friday has no 9th period, Saturday stops
   at the 6th) — visually distinct from .empty, which means "no class scheduled
   but the period exists" */
td.slot.off { background: repeating-linear-gradient(135deg, var(--line) 0, var(--line) 1px, transparent 1px, transparent 7px); opacity: .5; }

/* ---- variant: dua kolom (time | class-subject side by side) ---- */
body.variant-cols td.slot { padding-top: 5px; padding-bottom: 5px; }
body.variant-cols td.slot.filled .cellbox { display: grid; grid-template-columns: 30px 1fr; align-items: center; column-gap: 8px; }
body.variant-cols td.slot.filled .time { display: flex; flex-direction: column; align-items: center; gap: 1px; margin-bottom: 0; }
body.variant-cols td.slot.filled .time .sep { display: none; }

/* ---- variant: sebaris (single line, wider columns) ---- */
body.variant-inline td.slot.filled .cellbox { display: flex; align-items: baseline; gap: 7px; white-space: nowrap; }
body.variant-inline td.slot { padding-top: 8px; padding-bottom: 8px; }
body.variant-inline td.slot.filled .time { margin-bottom: 0; }
body.variant-inline td.slot.filled .combo { display: inline; }

.slide-enter-right { animation: enterRight .28s cubic-bezier(.2,.7,.3,1) both; }
.slide-enter-left { animation: enterLeft .28s cubic-bezier(.2,.7,.3,1) both; }
@keyframes enterRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes enterLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
@media (prefers-reduced-motion: reduce) { .slide-enter-right, .slide-enter-left { animation: none; } }

@media (max-width: 860px) {
  html, body { height: auto; overflow: visible; }
  .page-wrap { height: auto; }
  .page-header { margin: 0 16px; }
  .shell { height: auto; grid-template-columns: 1fr; align-items: normal; }
  .sidebar { height: auto; }
  .teacher-list { flex: 0 0 auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; overflow-y: visible; padding-bottom: 4px; }
  .teacher-item { flex: 0 0 auto; white-space: nowrap; }
  .main { height: auto; }
  .viewport { overflow: visible; flex: 0 0 auto; }
  .slide { height: auto; }
  .tablewrap { flex: 0 0 auto; max-height: 65vh; }
}
@media (max-width: 640px) {
  table.grid .daylong { display: none; }
  table.grid .dayshort { display: inline; }
  .meta-row { flex-direction: column; align-items: flex-start; }
}

  function buildList(filter) {
    var listEl = document.getElementById('teacherList');
    var noMatch = document.getElementById('noMatch');
    listEl.innerHTML = '';
    var shown = 0;
    order.forEach(function (nick, idx) {
      var matches = !filter || nick.toLowerCase().indexOf(filter) !== -1;
      if (!matches) return;
      shown++;
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.className = 'teacher-item' + (idx === current ? ' active' : '');
      btn.textContent = nick;
      btn.setAttribute('data-idx', idx);
      btn.addEventListener('click', function () { goTo(idx); });
      li.appendChild(btn);
      listEl.appendChild(li);
    });
    noMatch.style.display = shown === 0 ? 'block' : 'none';
  }

  function buildTable(t) {
    var thead = '<thead><tr><th scope="col" class="corner">Jam</th>' +
      days.map(function (d) {
        return '<th scope="col"><span class="daylong">' + dayId[d] + '</span><span class="dayshort">' + dayAbbr[d] + '</span></th>';
      }).join('') + '</tr></thead>';
    var rows = [];
    lessons.forEach(function (lesson) {
      var row = '<tr><th scope="row" class="jamcell"><span class="jamnum">' + String(lesson).padStart(2, '0') + '</span></th>';
      days.forEach(function (day) {
        if (validLessonsByDay[day].indexOf(lesson) === -1) {
          row += '<td class="slot off" aria-hidden="true"></td>';
          return;
        }
        var entries = t.cells[day + '|' + lesson];
        if (entries && entries.length) {
          // the source export can list the same class+subject twice for one slot
          // (a class split into tracks that rejoin for one subject) — dedupe for display,
          // total_lessons in the stats still counts every raw occurrence
          var seen = {}, uniq = [];
          entries.forEach(function (e) {
            var k = e['class'] + '|' + e.subject;
            if (!seen[k]) { seen[k] = true; uniq.push(e); }
          });
          var genders = {};
          uniq.forEach(function (e) { genders[e.gender] = true; });
          var cellGender = Object.keys(genders).length === 1 ? uniq[0].gender : 'mixed';
          var first = uniq[0];
          var comboHtml;
          if (uniq.length === 1) {
            comboHtml = '<span class="combo"><span class="cls">' + first['class'] + '</span><span class="subj">' + first.subject + '</span></span>';
          } else {
            var subjSet = {};
            uniq.forEach(function (e) { subjSet[e.subject] = true; });
            var subjKeys = Object.keys(subjSet);
            if (subjKeys.length === 1) {
              var clsList = uniq.map(function (e) { return '<span class="mcls ' + e.gender + '">' + e['class'] + '</span>'; }).join('<span class="msep">, </span>');
              comboHtml = '<span class="combo">' + clsList + '<span class="subj">' + subjKeys[0] + '</span></span>';
            } else {
              var pairs = uniq.map(function (e) { return '<span class="mcls ' + e.gender + '">' + e['class'] + '</span> <span class="subj">' + e.subject + '</span>'; }).join('<span class="msep">, </span>');
              comboHtml = '<span class="combo">' + pairs + '</span>';
            }
          }
          row += '<td class="slot filled ' + cellGender + '"><div class="cellbox">' +
            '<span class="time"><span class="t1">' + first.start + '</span><span class="sep">\u2013</span><span class="t2">' + first.end + '</span></span>' +
            comboHtml + '</div></td>';
        } else {
          row += '<td class="slot empty"><span class="dash">\u2013</span></td>';
        }
      });
      row += '</tr>';
      rows.push(row);
    });
    var body = '<tbody>' + rows.join('') + '</tbody>';
    return thead + body;
  }

  function render(direction) {
    var nick = order[current];
    var t = teachers[nick];
    document.getElementById('fullname').textContent = t.fullname;
    document.getElementById('nickname').textContent = t.nickname;
    document.getElementById('statLessons').textContent = t.stats.total_lessons;
    document.getElementById('statDays').textContent = t.stats.active_days;
    var classesStr = t.stats.classes.join(', ') || '\u2013';
    var subjectsStr = t.stats.subjects.join(', ') || '\u2013';
    document.getElementById('metaLine').innerHTML = 'Kelas <b>' + classesStr + '</b> &middot; Mapel <b>' + subjectsStr + '</b>';
    document.getElementById('gridTable').innerHTML = buildTable(t);

    var slide = document.getElementById('slide');
    slide.classList.remove('slide-enter-right', 'slide-enter-left');
    void slide.offsetWidth;
    slide.classList.add(direction === 'left' ? 'slide-enter-left' : 'slide-enter-right');

    document.title = 'Jadwal Mengajar \u2014 ' + t.nickname;
    if (history.replaceState) history.replaceState(null, '', '#' + encodeURIComponent(nick));
    buildList(document.getElementById('search').value.trim().toLowerCase());
  }

  function goTo(idx) {
    if (idx === current) return;
    var direction = idx > current ? 'right' : 'left';
    current = (idx + order.length) % order.length;
    render(direction);
  }

  document.getElementById('prevBtn').addEventListener('click', function () { goTo((current - 1 + order.length) % order.length); });
  document.getElementById('nextBtn').addEventListener('click', function () { goTo((current + 1) % order.length); });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') goTo((current + 1) % order.length);
    if (e.key === 'ArrowLeft') goTo((current - 1 + order.length) % order.length);
  });
  document.getElementById('search').addEventListener('input', function (e) {
    buildList(e.target.value.trim().toLowerCase());
  });

  var vsBtns = document.querySelectorAll('#vsBtns .vs-btn');
  vsBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      vsBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.body.classList.remove('variant-stacked', 'variant-cols', 'variant-inline');
      document.body.classList.add('variant-' + btn.getAttribute('data-variant'));
    });
  });

  var initial = decodeURIComponent(location.hash.replace('#', ''));
  var startIdx = order.indexOf(initial);
  current = startIdx >= 0 ? startIdx : 0;
  render('right');
})();
</script>
