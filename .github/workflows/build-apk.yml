name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Sync Capacitor Android
        run: npx cap add android

      - name: Disable predictive back gesture (use legacy back dispatch)
        run: |
          sed -i 's/android:allowBackup="true"/android:allowBackup="true"\n        android:enableOnBackInvokedCallback="false"/' android/app/src/main/AndroidManifest.xml
          echo "----- <application> tag after patch: -----"
          grep -A 5 '<application' android/app/src/main/AndroidManifest.xml
          if ! grep -q 'enableOnBackInvokedCallback="false"' android/app/src/main/AndroidManifest.xml; then
            echo "::error::sed pattern did not match — enableOnBackInvokedCallback was NOT set. Manifest content:"
            cat android/app/src/main/AndroidManifest.xml
            exit 1
          fi

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JadwalGuru-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JadwalGuru-debug-APK
          path: JadwalGuru-debug.apk
