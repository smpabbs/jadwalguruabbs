name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap add android

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JadwalGuru.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JadwalGuru-APK
          path: JadwalGuru.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Jadwal Guru - Build ${{ github.run_number }}"
          body: "APK Jadwal Mengajar Guru — SMP ABBS. Unduh file .apk, kirim ke HP, lalu install."
          files: JadwalGuru.apk
