name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap add android

      - name: Disable predictive back gesture (use legacy back dispatch)
        run: |
          sed -i 's/android:allowBackup="true"/android:allowBackup="true"\n        android:enableOnBackInvokedCallback="false"/' android/app/src/main/AndroidManifest.xml
          echo "----- <application> tag after patch: -----"
          grep -A 5 '<application' android/app/src/main/AndroidManifest.xml
          if ! grep -q 'enableOnBackInvokedCallback="false"' android/app/src/main/AndroidManifest.xml; then
            echo "::error::sed pattern did not match — enableOnBackInvokedCallback was NOT set. Manifest content:"
            cat android/app/src/main/AndroidManifest.xml
            exit 1
          fi

      - name: Configure stable signing (keystore permanen dari secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jadwalguru-signing.p12"
          export KEYSTORE_FILE="$RUNNER_TEMP/jadwalguru-signing.p12"
          export VERSION_CODE=${{ github.run_number }}
          export VERSION_NAME=$(node -p "require('./package.json').version")
          python3 scripts/set_stable_signing.py android/app/build.gradle

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK (versi dari package.json)
        id: apkname
        run: |
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "JadwalGuru-v${VER}.apk"
          echo "VER=${VER}" >> "$GITHUB_OUTPUT"
          echo "APK_FILE=JadwalGuru-v${VER}.apk" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=JadwalGuru-v${VER}-APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apkname.outputs.APK_NAME }}
          path: ${{ steps.apkname.outputs.APK_FILE }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apkname.outputs.VER }}
          name: Jadwal Guru v${{ steps.apkname.outputs.VER }}
          body: |
            Build APK otomatis dari commit `${{ github.sha }}`.

            Install: download `JadwalGuru-v${{ steps.apkname.outputs.VER }}.apk` di bawah,
            aktifkan "Install dari sumber tidak dikenal" di HP, lalu buka file APK.
          files: ${{ steps.apkname.outputs.APK_FILE }}
